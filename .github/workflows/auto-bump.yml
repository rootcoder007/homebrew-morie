name: Auto-bump on new morie tag

# Watches PyPI (rootcoder007/morie) for new vX.Y.Z releases and auto-PRs a formula
# bump.  Saves the manual sha256 + url update that currently happens
# on every release.
#
# Trigger: scheduled hourly + manual workflow_dispatch.
# Source of truth: https://pypi.org/pypi/morie/json -> info.version.

on:
  schedule:
    - cron: "17 * * * *"   # hourly at :17 to avoid the every-hour rush
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Find latest morie version on PyPI
        id: pypi
        run: |
          # One robust fetch. The old shell pipeline (curl | python | sed) died
          # on SIGPIPE ("echo: write error: Broken pipe") and made a redundant
          # per-version request that intermittently returned empty JSON. PyPI's
          # top-level /pypi/morie/json already carries the latest release's files
          # under `urls`, so a single request + retry is enough.
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json, sys, time, urllib.request, urllib.error
          out = sys.argv[1]
          data = None
          for attempt in range(3):
              try:
                  with urllib.request.urlopen("https://pypi.org/pypi/morie/json", timeout=30) as r:
                      data = json.load(r)
                  break
              except (urllib.error.URLError, json.JSONDecodeError) as e:
                  print(f"PyPI fetch attempt {attempt + 1} failed: {e}", file=sys.stderr)
                  time.sleep(5)
          if data is None:
              raise SystemExit("could not fetch morie metadata from PyPI after 3 tries")
          version = data["info"]["version"]
          sdist = next((u for u in data["urls"] if u["packagetype"] == "sdist"), None)
          if sdist is None:
              raise SystemExit(f"no sdist tarball published for morie {version}")
          with open(out, "a") as fh:
              fh.write(f"version={version}\n")
              fh.write(f"url={sdist['url']}\n")
              fh.write(f"sha={sdist['digests']['sha256']}\n")
          print("PyPI latest =", version)
          PY

      - name: Read formula version
        id: tap
        run: |
          set -euo pipefail
          ver=$(grep -oE 'morie-[0-9]+\.[0-9]+\.[0-9]+' Formula/morie.rb | head -1 | sed 's/morie-//')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Tap currently at $ver"

      - name: Bail if up-to-date
        if: steps.pypi.outputs.version == steps.tap.outputs.version
        run: |
          echo "Tap already at v${{ steps.pypi.outputs.version }}; nothing to do."
          exit 0

      - name: Patch formula
        if: steps.pypi.outputs.version != steps.tap.outputs.version
        run: |
          set -euo pipefail
          NEW_URL="${{ steps.pypi.outputs.url }}"
          NEW_SHA="${{ steps.pypi.outputs.sha }}"
          # Replace the url + sha256 lines.  Anchor on the leading
          # whitespace so we don't accidentally patch the resource:
          # blocks below (we don't ship resources, but defence-in-depth).
          python3 <<PY
          import pathlib, re
          p = pathlib.Path("Formula/morie.rb")
          s = p.read_text()
          s = re.sub(r'(\n\s*url\s+)"[^"]*"', r'\1"${NEW_URL}"', s, count=1)
          s = re.sub(r'(\n\s*sha256\s+)"[^"]*"', r'\1"${NEW_SHA}"', s, count=1)
          p.write_text(s)
          PY

      - name: Open PR with bump
        if: steps.pypi.outputs.version != steps.tap.outputs.version
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "formula: bump morie -> ${{ steps.pypi.outputs.version }}"
          branch: auto-bump/v${{ steps.pypi.outputs.version }}
          title: "formula: bump morie -> ${{ steps.pypi.outputs.version }}"
          body: |
            Auto-bump from PyPI.

            - Old: ${{ steps.tap.outputs.version }}
            - New: ${{ steps.pypi.outputs.version }}
            - URL: ${{ steps.pypi.outputs.url }}
            - sha256: `${{ steps.pypi.outputs.sha }}`

            See https://pypi.org/project/morie/${{ steps.pypi.outputs.version }}/.
